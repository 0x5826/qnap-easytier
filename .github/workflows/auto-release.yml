name: Auto Check & Release EasyTier QPKG

on:
  schedule:
    # 每周一 UTC 00:00 (北京时间早 08:00) 定期自动巡检上游官方版本
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      target_version:
        description: '指定构建版本（留空则自动生成修订版本，例如 2.6.4-r1）'
        required: false
        default: ''
      force_build:
        description: '是否强制重新构建'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'shared/**'
      - 'icons/**'
      - 'qpkg.cfg'
      - 'package_routines'
      - 'scripts/**'
      - 'x86_64/**'
      - 'arm_64/**'
      - '.github/workflows/auto-release.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-and-build:
    name: Build and Release QPKG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Build Target & Version
        id: version_check
        run: |
          set -e
          
          # 1. 获取当前仓库本地基准版本
          BASE_VER="$(cat shared/version 2>/dev/null || echo '2.6.4')"
          BASE_VER="${BASE_VER#v}"
          BUILD_DATE=$(date +'%Y%m%d')
          echo "本地仓库基准版本: $BASE_VER (构建日期: ${BUILD_DATE})"
          
          # 2. 判断触发源与构建目标版本
          INPUT_VER="${{ github.event.inputs.target_version }}"
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          TAG_REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          
          SHOULD_BUILD="false"
          TARGET_VER="$BASE_VER"
          TAG_NAME="v$BASE_VER"
          
          if [[ "$EVENT" == "push" && "$TAG_REF" =~ ^v[0-9] ]]; then
            TARGET_VER="${TAG_REF#v}"
            TAG_NAME="$TAG_REF"
            SHOULD_BUILD="true"
            echo "触发模式: Tag 推送 ($TAG_REF) -> 启动全量构建"
          elif [[ "$EVENT" == "push" ]]; then
            # 核心文件变更推送：采用日期作为修订版本标识 (例如 v2.6.4-20260917)
            TARGET_VER="${BASE_VER}-${BUILD_DATE}"
            TAG_NAME="v${TARGET_VER}"
            SHOULD_BUILD="true"
            echo "触发模式: 核心文件变更推送 -> 生成日期修订版 Release: $TAG_NAME"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [ -n "$INPUT_VER" ]; then
              TARGET_VER="${INPUT_VER#v}"
              TAG_NAME="v${TARGET_VER}"
            else
              TARGET_VER="${BASE_VER}-${BUILD_DATE}"
              TAG_NAME="v${TARGET_VER}"
            fi
            SHOULD_BUILD="true"
            echo "触发模式: 手动触发 -> 生成构建版本: $TAG_NAME"
          elif [[ "$EVENT" == "schedule" ]]; then
            echo "触发模式: 每周定时巡检上游官方版本..."
            UPSTREAM_TAG=$(curl -sSL "https://api.github.com/repos/EasyTier/EasyTier/releases/latest" | grep -o '"tag_name": "[^"]*' | cut -d'"' -f4 || true)
            if [ -n "$UPSTREAM_TAG" ]; then
              UPSTREAM_VER="${UPSTREAM_TAG#v}"
              echo "官方最新版本: $UPSTREAM_VER (本地基准: $BASE_VER)"
              if [ "$UPSTREAM_VER" != "$BASE_VER" ]; then
                TARGET_VER="$UPSTREAM_VER"
                TAG_NAME="v${UPSTREAM_VER}"
                SHOULD_BUILD="true"
                echo "检测到官方新版本升级，启动全量发布！"
              else
                echo "当前已与官方最新版本保持一致，本次巡检无需构建。"
              fi
            else
              echo "未能获取到官方最新 Release Tag，跳过构建。"
            fi
          fi
          
          echo "target_version=$TARGET_VER" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Setup QDK Build Environment
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full bc curl unzip rsync
          
          # 下载并安装官方 QDK 环境
          wget -q https://github.com/qnap-dev/QDK/archive/refs/tags/v2.3.14.tar.gz
          tar -xzf v2.3.14.tar.gz
          
          # 官方 QDK 核心文件位于解压后的 shared 目录
          sudo mkdir -p /usr/share/QDK /etc/config
          sudo cp -rf QDK-2.3.14/shared/* /usr/share/QDK/
          sudo chmod +x /usr/share/QDK/bin/*
          sudo ln -sf /usr/share/QDK/bin/qbuild /usr/local/bin/qbuild
          
          # 配置 QDK 路径
          sudo cp /usr/share/QDK/qdk.conf /etc/config/qdk.conf
          sudo sed -i 's|^QDK_PATH_P=.*|QDK_PATH_P=/usr/share|' /etc/config/qdk.conf
          sudo sed -i 's|^QDK_PATH=.*|QDK_PATH=/usr/share/QDK|' /etc/config/qdk.conf
          
          qbuild --version || true

      - name: Prepare Binaries & Configs
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          TARGET_VER="${{ steps.version_check.outputs.target_version }}"
          BASE_VER="$(cat shared/version 2>/dev/null || echo '')"
          BASE_VER="${BASE_VER#v}"
          
          # 仅当大版本变更且本地无对应二进制时，才拉取上游二进制
          CORE_VER="${TARGET_VER%%-*}"
          if [ "$CORE_VER" != "$BASE_VER" ] || [ ! -f "x86_64/easytier-core" ] || [ ! -f "arm_64/easytier-core" ]; then
            echo "正在下载 EasyTier v${CORE_VER} 双架构静态程序..."
            chmod +x scripts/download_binaries.sh
            ./scripts/download_binaries.sh "${CORE_VER}"
            echo "${CORE_VER}" > shared/version
          else
            echo "基础核心程序 (v${CORE_VER}) 与本地完备，直接使用现有二进制打包。"
          fi

      - name: Build QPKG Packages
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          TARGET_VER="${{ steps.version_check.outputs.target_version }}"
          mkdir -p release
          rm -f release/*.qpkg release/*.md5
          
          # 1. 构建 x86_64 架构包
          echo "Building x86_64 package (v${TARGET_VER})..."
          rm -rf build_pkg
          mkdir -p build_pkg/x86_64 build_pkg/icons build_pkg/shared
          cp -r package_routines qpkg.cfg build_pkg/
          cp -r icons/* build_pkg/icons/
          cp -r shared/* build_pkg/shared/
          cp x86_64/easytier-core x86_64/easytier-cli build_pkg/x86_64/
          
          chmod +x build_pkg/package_routines build_pkg/shared/easytier.sh build_pkg/shared/easytierconfig build_pkg/x86_64/* || true
          sed -i 's/^QPKG_DIR=.*/QPKG_DIR="x86_64"/' build_pkg/qpkg.cfg
          sed -i 's/^QPKG_NAME=.*/QPKG_NAME="easytier"/' build_pkg/qpkg.cfg
          sed -i "s/^QPKG_VER=.*/QPKG_VER=\"${TARGET_VER}\"/" build_pkg/qpkg.cfg
          (cd build_pkg && qbuild --build-dir ../release)
          
          # 2. 构建 arm_64 架构包
          echo "Building arm_64 package (v${TARGET_VER})..."
          rm -rf build_pkg
          mkdir -p build_pkg/arm_64 build_pkg/icons build_pkg/shared
          cp -r package_routines qpkg.cfg build_pkg/
          cp -r icons/* build_pkg/icons/
          cp -r shared/* build_pkg/shared/
          cp arm_64/easytier-core arm_64/easytier-cli build_pkg/arm_64/
          
          chmod +x build_pkg/package_routines build_pkg/shared/easytier.sh build_pkg/shared/easytierconfig build_pkg/arm_64/* || true
          sed -i 's/^QPKG_DIR=.*/QPKG_DIR="arm_64"/' build_pkg/qpkg.cfg
          sed -i 's/^QPKG_NAME=.*/QPKG_NAME="easytier"/' build_pkg/qpkg.cfg
          sed -i "s/^QPKG_VER=.*/QPKG_VER=\"${TARGET_VER}\"/" build_pkg/qpkg.cfg
          (cd build_pkg && qbuild --build-dir ../release)
          rm -rf build_pkg

          # 3. 计算 MD5 校验和
          cd release
          for f in *.qpkg; do
            [ -f "$f" ] && md5sum "$f" > "${f}.md5"
          done
          echo "构建完成制品列表："
          ls -lh

      - name: Publish GitHub Release
        if: steps.version_check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version_check.outputs.tag_name }}"
          name: "EasyTier QPKG ${{ steps.version_check.outputs.tag_name }}"
          draft: false
          prerelease: false
          files: |
            release/*.qpkg
            release/*.qpkg.md5
          body: |
            ### 威联通 QNAP EasyTier 原生插件发布 (${{ steps.version_check.outputs.tag_name }})
            
            - **基础核心版本**：EasyTier `v${{ steps.version_check.outputs.target_version }}`
            - **构建触发源**：`${{ github.event_name }}`
            - **提交哈希**：`${{ github.sha }}`
            
            #### 📦 安装包下载
            - `easytier_${{ steps.version_check.outputs.target_version }}_x86_64.qpkg`（适用于 Intel / AMD 架构 NAS）
            - `easytier_${{ steps.version_check.outputs.target_version }}_arm_64.qpkg`（适用于 ARM64 架构 NAS）
            
            #### 🛠️ 快速安装说明
            1. 下载对应 NAS 架构的 `.qpkg` 文件；
            2. 登录 QTS 桌面 ➔ 打开 **App Center** ➔ 点击右上角手动安装；
            3. 安装成功后即可通过 QTS 桌面图标访问现代 WebUI 控制台。
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated Binaries to Main
        if: steps.version_check.outputs.should_build == 'true' && github.event_name == 'schedule'
        run: |
          TARGET_VER="${{ steps.version_check.outputs.target_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add shared/version qpkg.cfg x86_64/ arm_64/
          if git diff --staged --quiet; then
            echo "仓库核心文件无变更，无需提交"
          else
            git commit -m "[auto] 同步上游 EasyTier v${TARGET_VER} 并更新构建产物"
            git push origin HEAD:main
          fi
